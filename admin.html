<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | Bengaluru Gems</title>

<meta name="description"
content="Bengaluru Gems Admin Dashboard">

<!-- Bootstrap -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- Bootstrap Icons -->

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Google Fonts -->

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<!-- CSS -->

<link rel="stylesheet"
href="css/variables.css">

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="css/admin.css">

</head>

<body>

<!--=========================
Header
==========================-->

<header class="admin-header">

<div class="container">

<div class="d-flex justify-content-between align-items-center">

<div>

<h1>

<i class="bi bi-speedometer2"></i>

Bengaluru Gems Admin

</h1>

<p>

Manage Products, Orders & Customers

</p>

</div>

<a
href="index.html"
class="btn btn-outline-light">

<i class="bi bi-house"></i>

Back To Website

</a>

</div>

</div>

</header>

<!--=========================
Dashboard Cards
==========================-->

<section class="py-5">

<div class="container">

<div class="row g-4">

<div class="col-lg-3 col-md-6">

<div class="dashboard-card">

<i class="bi bi-box-seam"></i>

<h5>

Products

</h5>

<h2 id="productCount">

0

</h2>

</div>

</div>

<div class="col-lg-3 col-md-6">

<div class="dashboard-card">

<i class="bi bi-cart-check"></i>

<h5>

Orders

</h5>

<h2 id="orderCount">

0

</h2>

</div>

</div>

<div class="col-lg-3 col-md-6">

<div class="dashboard-card">

<i class="bi bi-heart-fill"></i>

<h5>

Wishlist

</h5>

<h2 id="wishlistCount">

0

</h2>

</div>

</div>

<div class="col-lg-3 col-md-6">

<div class="dashboard-card">

<i class="bi bi-people-fill"></i>

<h5>

Customers

</h5>

<h2 id="customerCount">

0

</h2>

</div>

</div>

</div>

</div>

</section>

<!--=========================
Product Controls
==========================-->

<section class="pb-5">

<div class="container">

<div class="card admin-panel">

<div class="card-body">

<div class="row g-3">

<div class="col-lg-6">

<input

type="text"

id="searchProduct"

class="form-control"

placeholder="Search Product">

</div>

<div class="col-lg-6 text-lg-end">

<button

class="btn btn-warning"

data-bs-toggle="modal"

data-bs-target="#productModal">

<i class="bi bi-plus-circle"></i>

Add Product

</button>

</div>

</div>

<hr>

<div class="table-responsive">

<table class="table table-dark table-hover align-middle">

<thead>

<tr>

<th>ID</th>

<th>Image</th>

<th>Name</th>

<th>Category</th>

<th>Price</th>

<th>Rating</th>

<th>Stock</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="productTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</section>

<!--=========================
Add / Edit Product Modal
==========================-->

<div

class="modal fade"

id="productModal"

tabindex="-1">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h4>

Add Product

</h4>

<button

class="btn-close"

data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<div class="row g-3">

<div class="col-md-6">

<label>

Product Name

</label>

<input

type="text"

id="productName"

class="form-control">

</div>

<div class="col-md-6">

<label>

Category

</label>

<select

id="productCategory"

class="form-select">

<option>

Gemstone

</option>

<option>

Jewellery

</option>

</select>

</div>

<div class="col-md-6">

<label>

Price

</label>

<input

type="number"

id="productPrice"

class="form-control">

</div>

<div class="col-md-6">

<label>

Rating

</label>

<input

type="number"

step="0.1"

id="productRating"

class="form-control">

</div>

<div class="col-md-6">

<label>

Image

</label>

<input

type="text"

id="productImage"

class="form-control"

placeholder="images/products/image.jpg">

</div>

<div class="col-md-6">

<label>

Stock

</label>

<select

id="productStock"

class="form-select">

<option value="true">

In Stock

</option>

<option value="false">

Out of Stock

</option>

</select>

</div>

<div class="col-12">

<label>

Description

</label>

<textarea

rows="4"

id="productDescription"

class="form-control">

</textarea>

</div>

</div>

</div>

<div class="modal-footer">

<button

class="btn btn-secondary"

data-bs-dismiss="modal">

Close

</button>

<button

class="btn btn-warning"

id="saveProduct">

Save Product

</button>

</div>

</div>

</div>

</div>

<!--=========================
Footer
==========================-->

<footer class="text-center py-4">

© 2026 Bengaluru Gems Admin Panel

</footer>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Product Data -->

<script src="js/products.js"></script>

<!-- Admin Script -->

<script src="js/admin.js"></script>

</body>

</html>
